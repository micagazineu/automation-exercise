name: Cypress E2E Automation

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      spec:
        description: 'Spec path to run (optional, e.g. cypress/e2e/login.cy.ts)'
        required: false
        default: ''
      browser:
        description: 'Browser to run on'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - firefox
          - electron
          - edge

jobs:
  cypress-run:
    name: Cypress Headless E2E (${{ inputs.browser || 'chrome' }})
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          install: false # Já instalado via npm ci
          browser: ${{ inputs.browser || 'chrome' }}
          headless: true
          spec: ${{ inputs.spec || '' }}
          # Descomente e ajuste se sua aplicação precisa subir localmente:
          # start: npm run start
          # wait-on: 'http://localhost:3000'
          # wait-on-timeout: 120
        env:
          CYPRESS_BASE_URL: ${{ secrets.CYPRESS_BASE_URL }}

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-report
          path: cypress/reports/html
          retention-days: 7

      - name: Upload Screenshots on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Videos on Failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 7
          if-no-files-found: ignore
